name: Build Slides

# Compiles the Typst slide deck to PDF on every push, uploads it as a build
# artifact, and attaches the built PDFs to GitHub releases on tags.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'slides/**'
      - 'slide-examples/**'
      - '.github/workflows/slides.yml'
  pull_request:
    branches: [main]
    paths:
      - 'slides/**'
      - 'slide-examples/**'
  workflow_dispatch:

permissions:
  contents: write   # needed to attach assets to a release on tags

jobs:
  build:
    name: Compile deck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: '0.15.1'

      - name: Compile (neutral defaults)
        run: typst compile --root . slides/main.typ slides.pdf

      - name: Compile (TUM variant)
        run: typst compile --root . --input variant=tum slides/main.typ slides-tum.pdf

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: |
            slides.pdf
            slides-tum.pdf

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            slides.pdf
            slides-tum.pdf
